# Render Blueprint — one-click deploy of EcoClean Connect (full stack)
# After this repo is on GitHub, go to Render > New > Blueprint > select this repo.
services:
  - type: web
    name: ecoclean-connect
    runtime: node
    plan: free
    branch: main
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      # IMPORTANT: after deploy, open Render > Environment and set ADMIN_KEY
      # to your own secret. The admin panel uses this key to verify reports.
      - key: ADMIN_KEY
        sync: false
