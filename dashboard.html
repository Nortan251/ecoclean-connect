<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EcoClean Connect — Dashboard</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon.svg" />
  <link rel="stylesheet" href="css/styles.css?v=3" />
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <img src="icon.svg" class="brand-icon" />
      <div><h1 data-i18n="dash_title">Dashboard</h1><p class="tagline" data-i18n="dash_sub">Impact at a glance</p></div>
    </div>
    <nav class="topnav">
      <a href="index.html" data-i18n="btn_open_map">Map</a>
      <a href="admin.html" data-i18n="nav_admin">Admin</a>
      <select id="langSelect" class="lang-select" aria-label="Language">
        <option value="en">English</option>
        <option value="fr">Français</option>
        <option value="ar">العربية</option>
      </select>
    </nav>
  </header>

  <main class="dash">
    <div class="stats" id="stats"></div>
    <h2 data-i18n="by_category">By category</h2>
    <div id="cats"></div>
    <h2 data-i18n="recent_activity">Recent activity</h2>
    <div id="recent" class="report-list"></div>
    <section id="wallet" class="card"><h2>Reward Wallet</h2><div id="points">0 pts</div><div id="vouchers"></div></section>
    <section id="questsBox" class="card"><h2>Weekly Quests</h2><div id="quests"></div></section>
    <section id="lbBox" class="card"><h2>Neighborhood Leaderboard</h2><div id="leaderboard"></div></section>
    <section id="analytics" class="card"><h2>Impact Analytics</h2><canvas id="catChart"></canvas><div id="resChart"></div><div id="volChart"></div></section>
  </main>

  <script src="js/i18n.js"></script>
  <script src="js/ecoclean-addons.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <script src="js/rewards.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="js/gamification.js"></script>
  <script src="js/analytics.js"></script>
  <script src="js/install-prompt.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="js/realtime.js"></script>
  <script src="js/offline-banner.js"></script>
  <script src="js/a11y.js"></script>
  <script src="js/export-data.js"></script>
</body>
</html>
