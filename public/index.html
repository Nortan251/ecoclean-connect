<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#198754" />
  <title>EcoClean Connect</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon.svg" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <img src="icon.svg" alt="" class="brand-icon" />
      <div>
        <h1>EcoClean Connect</h1>
        <p class="tagline">Report pollution. Mobilize your community.</p>
      </div>
    </div>
    <nav class="topnav">
      <a href="dashboard.html">Dashboard</a>
      <a href="admin.html">Admin</a>
    </nav>
  </header>

  <section id="alerts" class="alerts"></section>

  <main>
    <div id="map"></div>
  </main>

  <button id="reportBtn" class="fab">+ Report Pollution</button>

  <!-- Report modal -->
  <div id="reportModal" class="modal hidden">
    <div class="modal-card">
      <div class="modal-head">
        <h2>Report a pollution site</h2>
        <button id="closeModal" class="icon-btn" aria-label="Close">&times;</button>
      </div>
      <form id="reportForm">
        <label>Your name (optional)
          <input type="text" name="reporterName" placeholder="Anonymous" />
        </label>
        <label>Category
          <select name="category" required>
            <option value="illegal_dumping">Illegal Dumping</option>
            <option value="water">Water Pollution</option>
            <option value="air_smoke">Air / Smoke</option>
            <option value="plastic_marine">Plastic / Marine</option>
            <option value="other">Other</option>
          </select>
        </label>
        <label>Photo (required)
          <input type="file" name="photo" accept="image/*" capture="environment" required />
        </label>
        <label>Description
          <textarea name="description" rows="3" placeholder="What's happening here?"></textarea>
        </label>
        <div class="loc-row">
          <label>Latitude
            <input type="number" step="any" name="lat" id="latInput" required />
          </label>
          <label>Longitude
            <input type="number" step="any" name="lng" id="lngInput" required />
          </label>
        </div>
        <button type="button" id="useLoc" class="ghost-btn">📍 Use my location</button>
        <button type="submit" class="primary-btn">Submit report</button>
        <p id="formMsg" class="form-msg"></p>
      </form>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
